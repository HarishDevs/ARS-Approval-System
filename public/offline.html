<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · ARS-CMS</title>
    <style>
      :root { --page: #f6f8fb; --ink: #0f1b2d; --muted: #4b5a70; --primary: #003b6e; --card: #ffffff; --line: #d9e0ea; }
      @media (prefers-color-scheme: dark) { :root { --page: #0e131b; --ink: #e8edf5; --muted: #a3b0c2; --primary: #6fa8ff; --card: #151c27; --line: #263142; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: var(--muted); }
      .button { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; }
      @media (prefers-color-scheme: dark) { .button { color: #0e131b; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="ARS" />
      <h1>You're offline</h1>
      <p>ARS-CMS needs the internet to show approvals, tasks and records. Nothing is kept on this device. Check your connection and try again.</p>
      <a class="button" href="/users">Try again</a>
    </main>
  </body>
</html>
